services:
  exitwise:
    build:
      context: .
    image: exitwise:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${EXITWISE_PORT:-3000}:3000"
    volumes:
      - exitwise-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 30s

volumes:
  exitwise-data:
